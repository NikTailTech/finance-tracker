apiVersion: v1
kind: ConfigMap
metadata:
  name: finance-tracker-config
  namespace: apps
data:
  NODE_ENV: production
  PORT: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-app
  namespace: apps
  labels:
    app: finance-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-app
  template:
    metadata:
      labels:
        app: finance-app
    spec:
      containers:
        - name: finance-app
          image: ghcr.io/niktailtech/finance-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: finance-tracker-config
            - secretRef:
                name: finance-tracker-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: finance-app
  namespace: apps
spec:
  type: NodePort
  selector:
    app: finance-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30002